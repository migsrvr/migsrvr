<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Miggy Rivera</title>
  <desc id="d">Backend and full-stack developer building AI-powered products</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#150b1c"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54F4FF"/>
      <stop offset="0.55" stop-color="#9aa8ff"/>
      <stop offset="1" stop-color="#FF3B93"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54F4FF"/>
      <stop offset="1" stop-color="#FF3B93" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#54F4FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#54F4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B93" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3B93" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float1 { animation: f1 7s ease-in-out infinite; }
    .float2 { animation: f2 9s ease-in-out infinite; }
    .float3 { animation: f1 11s ease-in-out infinite reverse; }
    @keyframes f1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes f2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <!-- base -->
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#dots)"/>

    <!-- colour glows -->
    <circle class="pulse" cx="1000" cy="110" r="320" fill="url(#glowC)"/>
    <circle class="pulse" cx="1120" cy="430" r="300" fill="url(#glowP)"/>
    <circle cx="80" cy="470" r="240" fill="url(#glowC)" opacity="0.35"/>

    <!-- diagonal light streaks -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M700 -20 L1000 460"/>
      <path d="M760 -20 L1060 460"/>
      <path d="M820 -20 L1120 460"/>
      <path d="M880 -20 L1180 460"/>
    </g>

    <!-- orbit artwork (right) -->
    <g transform="translate(980 220)">
      <circle r="190" fill="none" stroke="#54F4FF" stroke-opacity="0.12"/>
      <circle r="140" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        <circle r="170" fill="none" stroke="#54F4FF" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2 14" stroke-linecap="round"/>
        <circle cx="170" cy="0" r="6" fill="#54F4FF"/>
        <circle cx="170" cy="0" r="14" fill="#54F4FF" opacity="0.25" filter="url(#soft)"/>
      </g>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite"/>
        <circle r="115" fill="none" stroke="#FF3B93" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="40 18 4 18"/>
        <circle cx="-115" cy="0" r="5" fill="#FF3B93"/>
        <circle cx="-115" cy="0" r="13" fill="#FF3B93" opacity="0.3" filter="url(#soft)"/>
      </g>

      <!-- core -->
      <circle r="62" fill="#0d1117" stroke="url(#name)" stroke-width="2"/>
      <circle r="62" fill="url(#glowC)" opacity="0.5"/>
      <text class="mono" x="0" y="13" text-anchor="middle" font-size="38" font-weight="700" fill="url(#name)">&lt;/&gt;</text>
    </g>

    <!-- floating accents -->
    <g class="float1"><rect x="640" y="70" width="14" height="14" rx="3" fill="none" stroke="#54F4FF" stroke-opacity="0.7" transform="rotate(20 647 77)"/></g>
    <g class="float2"><circle cx="810" cy="412" r="5" fill="#FF3B93" fill-opacity="0.8"/></g>
    <g class="float3"><path d="M760 55 l8 14 h-16 z" fill="none" stroke="#FF3B93" stroke-opacity="0.7"/></g>
    <g class="float2"><circle cx="1130" cy="60" r="3" fill="#54F4FF"/></g>
    <g class="float1"><circle cx="870" cy="400" r="3" fill="#54F4FF" fill-opacity="0.8"/></g>

    <!-- left accent bar -->
    <rect x="0" y="0" width="6" height="440" fill="url(#name)" opacity="0.9"/>

    <!-- text -->
    <text class="mono" x="80" y="104" font-size="17" fill="#54F4FF" letter-spacing="2">// HELLO, WORLD. I'M</text>

    <text class="sans" x="76" y="196" font-size="86" font-weight="800" letter-spacing="3" fill="url(#name)">MIGGY RIVERA</text>

    <rect x="80" y="222" width="380" height="3" rx="1.5" fill="url(#rule)"/>

    <text class="sans" x="80" y="272" font-size="27" font-weight="600" fill="#e6edf3">Backend &amp; full-stack developer building AI-powered products</text>

    <text class="mono" x="80" y="312" font-size="18" fill="#8b949e">retrieval systems  ·  internal tools  ·  student-facing apps</text>

    <!-- chips -->
    <g class="mono" font-size="15" letter-spacing="1" text-anchor="middle">
      <rect x="80" y="348" width="150" height="38" rx="19" fill="#54F4FF" fill-opacity="0.08" stroke="#54F4FF" stroke-opacity="0.6"/>
      <text x="155" y="372" fill="#54F4FF">PHILIPPINES</text>

      <rect x="246" y="348" width="140" height="38" rx="19" fill="#9aa8ff" fill-opacity="0.08" stroke="#9aa8ff" stroke-opacity="0.6"/>
      <text x="316" y="372" fill="#b8c2ff">BSIT @ JRU</text>

      <rect x="402" y="348" width="372" height="38" rx="19" fill="#FF3B93" fill-opacity="0.08" stroke="#FF3B93" stroke-opacity="0.65"/>
      <circle cx="427" cy="367" r="4" fill="#FF3B93">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="604" y="372" fill="#ff7ab6">OPEN TO INTERNSHIPS &amp; FREELANCE</text>
    </g>

    <!-- frame -->
    <rect x="1" y="1" width="1198" height="438" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
</svg>
